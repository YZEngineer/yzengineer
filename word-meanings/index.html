<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غريب الكلمات</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Naskh Arabic', 'Amiri', serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
  header { text-align: center; margin-bottom: 30px; }
  header h1 {
    font-family: 'Amiri', serif;
    font-size: 2.5em;
    color: #f0c27f;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(240,194,127,0.3);
  }
  header .bismillah {
    font-family: 'Amiri', serif;
    font-size: 1.3em;
    color: #d4af37;
    margin-bottom: 12px;
  }
  header p { color: #b8b8d4; font-size: 0.95em; }
  .stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .stat-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 22px;
    text-align: center;
    min-width: 120px;
  }
  .stat-box .num { font-size: 1.6em; font-weight: 600; color: #f0c27f; }
  .stat-box .label { font-size: 0.8em; color: #b8b8d4; margin-top: 3px; }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab-btn {
    padding: 10px 28px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    background: transparent;
    color: #b8b8d4;
    cursor: pointer;
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 1em;
    transition: all 0.3s;
  }
  .tab-btn:hover { border-color: #f0c27f; color: #f0c27f; }
  .tab-btn.active {
    background: #f0c27f;
    color: #1a1a2e;
    border-color: #f0c27f;
    font-weight: 600;
  }

  .search-box {
    max-width: 550px;
    margin: 0 auto 25px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 14px 50px 14px 20px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 50px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 1.1em;
    outline: none;
    transition: all 0.3s;
    direction: rtl;
  }
  .search-box input::placeholder { color: #888; }
  .search-box input:focus {
    border-color: #f0c27f;
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 20px rgba(240,194,127,0.2);
  }
  .search-box .icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.3em;
    color: #888;
  }

  .result-count {
    text-align: center;
    color: #888;
    font-size: 0.9em;
    margin-bottom: 15px;
    display: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card:hover {
    background: rgba(240,194,127,0.15);
    border-color: rgba(240,194,127,0.4);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }
  .card .num {
    font-size: 1.4em;
    font-weight: 600;
    color: #f0c27f;
    min-width: 38px;
    text-align: center;
  }
  .card .info { flex: 1; text-align: right; }
  .card .ar-name {
    font-family: 'Amiri', serif;
    font-size: 1.25em;
  }

  .word-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .word-card:hover {
    background: rgba(240,194,127,0.15);
    border-color: rgba(240,194,127,0.4);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }
  .word-card .word-text {
    font-family: 'Amiri', serif;
    font-size: 1.2em;
    color: #f0c27f;
    min-width: 120px;
  }
  .word-card .word-info { flex: 1; text-align: right; }
  .word-card .word-surah {
    font-size: 0.9em;
    color: #b8b8d4;
  }
  .word-card .word-num {
    font-size: 0.8em;
    color: #888;
  }

  .word-table-wrap {
    width: 100%;
    overflow-x: auto;
    margin-top: 10px;
  }
  .word-table {
    border-collapse: collapse;
    width: 100%;
    margin: 20px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    background: #fff;
  }
  .word-table th {
    background: #1a237e;
    color: #fff;
    padding: 10px;
    font-size: 1.1em;
    text-align: center;
    border: 1px solid #ddd;
    white-space: nowrap;
  }
  .word-table td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
    font-size: 0.95em;
    vertical-align: top;
  }
  .word-table tr:nth-child(even) { background: #f5f5ff; }
  .word-table tr:hover td { background: #e8eaf6; }
  .word-table tr:hover td {
    background: rgba(240,194,127,0.08);
  }
  .word-table .ar {
    font-size: 1.15em;
    text-align: right;
    padding-right: 12px;
  }
  .word-table .exp {
    text-align: right;
    font-size: .95em;
    line-height: 1.6;
    word-wrap: break-word;
  }
  .word-table a {
    color: inherit;
    text-decoration: none;
  }
  .word-table a:hover { color: #1a237e; }

  .no-results {
    text-align: center;
    padding: 50px 20px;
    color: #888;
    font-size: 1.1em;
    display: none;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    padding: 20px;
    color: #666;
    font-size: 0.85em;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  footer a { color: #f0c27f; text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.8em; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
    <h1>غريب الكلمات</h1>
    <div class="stats">
      <div class="stat-box"><div class="num" id="surah-count">0</div><div class="label">سورة</div></div>
      <div class="stat-box"><div class="num" id="word-count">0</div><div class="label">كلمة</div></div>
      <div class="stat-box"><div class="num">dorar.net</div><div class="label">المصدر</div></div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="surahs">سور</button>
    <button class="tab-btn" data-tab="words">كلمات</button>
  </div>

  <div class="search-box">
    <span class="icon">&#128269;</span>
    <input type="text" id="search" placeholder="ابحث..." autocomplete="off">
  </div>

  <div class="result-count" id="result-count"></div>
  <div  id="grid"></div>
  <div class="no-results" id="no-results">لا توجد نتائج</div>

  <footer>
    مصدر التفاسير: <a href="https://dorar.net/tafseer" target="_blank">الدرر السنية - dorar.net</a>
  </footer>
</div>

<script src="data.js"></script>
<script>
const surahs = [
  {n:1,ar:"الفاتحة"},{n:2,ar:"البقرة"},{n:3,ar:"آل عمران"},{n:4,ar:"النساء"},{n:5,ar:"المائدة"},
  {n:6,ar:"الأنعام"},{n:7,ar:"الأعراف"},{n:8,ar:"الأنفال"},{n:9,ar:"التوبة"},{n:10,ar:"يونس"},
  {n:11,ar:"هود"},{n:12,ar:"يوسف"},{n:13,ar:"الرعد"},{n:14,ar:"إبراهيم"},{n:15,ar:"الحجر"},
  {n:16,ar:"النحل"},{n:17,ar:"الإسراء"},{n:18,ar:"الكهف"},{n:19,ar:"مريم"},{n:20,ar:"طه"},
  {n:21,ar:"الأنبياء"},{n:22,ar:"الحج"},{n:23,ar:"المؤمنون"},{n:24,ar:"النور"},{n:25,ar:"الفرقان"},
  {n:35,ar:"فاطر"},{n:38,ar:"ص"},{n:39,ar:"الزمر"},{n:40,ar:"غافر"},{n:41,ar:"فصلت"},
  {n:42,ar:"الشورى"},{n:43,ar:"الزخرف"},{n:46,ar:"الأحقاف"},{n:47,ar:"محمد"},{n:49,ar:"الحجرات"},
  {n:50,ar:"ق"},{n:51,ar:"الذاريات"},{n:52,ar:"الطور"},{n:53,ar:"النجم"},{n:54,ar:"القمر"},
  {n:55,ar:"الرحمن"},{n:57,ar:"الحديد"},{n:59,ar:"الحشر"},{n:60,ar:"الممتحنة"},{n:61,ar:"الصف"},
  {n:62,ar:"الجمعة"},{n:63,ar:"المنافقون"},{n:64,ar:"التغابن"},{n:65,ar:"الطلاق"},{n:66,ar:"التحريم"},
  {n:67,ar:"الملك"},{n:68,ar:"القلم"},{n:70,ar:"المعارج"},{n:71,ar:"نوح"},{n:72,ar:"الجن"},
  {n:73,ar:"المزمل"},{n:75,ar:"القيامة"},{n:76,ar:"الإنسان"},{n:77,ar:"المرسلات"},{n:78,ar:"النبأ"},
  {n:79,ar:"النازعات"},{n:80,ar:"عبس"},{n:81,ar:"التكوير"},{n:82,ar:"الانفطار"},{n:83,ar:"المطففين"},
  {n:84,ar:"الانشقاق"},{n:85,ar:"البروج"},{n:86,ar:"الطارق"},{n:87,ar:"الأعلى"},{n:88,ar:"الغاشية"},
  {n:89,ar:"الفجر"},{n:90,ar:"البلد"},{n:91,ar:"الشمس"},{n:92,ar:"الليل"},{n:93,ar:"الضحى"},
  {n:94,ar:"الشرح"},{n:95,ar:"التين"},{n:96,ar:"العلق"},{n:98,ar:"البينة"},{n:99,ar:"الزلزلة"},
  {n:100,ar:"العاديات"},{n:101,ar:"القارعة"},{n:102,ar:"التكاثر"},{n:104,ar:"الهمزة"},{n:105,ar:"الفيل"},
  {n:106,ar:"قريش"},{n:107,ar:"الماعون"},{n:108,ar:"الكوثر"},{n:110,ar:"النصر"},{n:111,ar:"المسد"},
  {n:112,ar:"الإخلاص"},{n:113,ar:"الفلق"},{n:114,ar:"الناس"}
];

var surahNames = {};
surahs.forEach(function(s) { surahNames[s.n] = s.ar; });

var activeTab = "surahs";
var grid = document.getElementById("grid");
var searchInput = document.getElementById("search");
var noResults = document.getElementById("no-results");
var resultCount = document.getElementById("result-count");

document.getElementById("surah-count").textContent = surahs.length;
document.getElementById("word-count").textContent = allData.length;

document.querySelectorAll(".tab-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    activeTab = btn.getAttribute("data-tab");
    searchInput.placeholder = activeTab === "surahs" ? "ابحث عن سورة..." : "ابحث عن كلمة...";
    searchInput.value = "";
    render();
  });
});

function removeHarakat(s) {
  return s.replace(/[\u064B-\u0652\u0670\u0610-\u061A\u06D6-\u06DC\u06DF-\u06E4\u06E7\u06E8\u06EA-\u06ED]/g, '').replace(/\u0651/g, '');
}

function render() {
  var q = searchInput.value.trim();
  var qNoHarakat = removeHarakat(q);
  grid.innerHTML = "";
  var count = 0;

  if (activeTab === "surahs") {
    resultCount.style.display = "none";
    for (var i = 0; i < surahs.length; i++) {
      var s = surahs[i];
      if (q) {
        var matchNum = s.n.toString() === q;
        var matchAr = s.ar.indexOf(q) !== -1;
        var matchArClean = removeHarakat(s.ar).indexOf(qNoHarakat) !== -1;
        if (!matchNum && !matchAr && !matchArClean) continue;
      }
      count++;
      var card = document.createElement("a");
      card.className = "card";
      card.href = "result.html?surah=" + s.n;
      card.target = "_blank";
      card.innerHTML = '<div class="num">' + s.n + '</div><div class="info"><div class="ar-name">' + s.ar + '</div></div>';
      grid.appendChild(card);
    }
  } else {
    if (!allData.length) {
      noResults.style.display = "block";
      return;
    }
    if (!q) {
      resultCount.style.display = "none";
      noResults.style.display = "none";
      grid.innerHTML = '<div style="text-align:center;color:#666;padding:40px;font-size:1em;">كلمة للبحث في '+ allData.length + ' كلمة</div>';
      return;
    }
    var limit = 200;
    var tableHTML = '<div class="word-table-wrap"><table class="word-table"><thead><tr><th>#</th><th>الكلمة</th><th>الشرح</th><th>الآيات</th><th>السورة</th></tr></thead><tbody>';
    for (var j = 0; j < allData.length && count < limit; j++) {
      var w = allData[j];
      var wClean = removeHarakat(w.word);
      if (w.word.indexOf(q) !== -1 || wClean.indexOf(qNoHarakat) !== -1) {
        count++;
        tableHTML += '<tr><td>' + count + '</td><td class="ar"><a href="result.html?surah=' + w.surah + '">' + w.word + '</a></td><td class="ar exp">' + w.explanation + '</td><td>' + w.ayah_range + '</td><td><a href="result.html?surah=' + w.surah + '">سورة ' + (surahNames[w.surah] || w.surah) + '</a></td></tr>';
      }
    }
    tableHTML += '</tbody></table></div>';
    if (count > 0) {
      grid.innerHTML = tableHTML;
    }
    resultCount.style.display = "block";
    resultCount.textContent = count + " نتيجة";
  }

  noResults.style.display = count === 0 ? "block" : "none";
}

searchInput.addEventListener("input", render);
render();
</script>

</body>
</html>
