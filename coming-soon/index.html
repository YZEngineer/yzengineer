<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قريباً...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Naskh Arabic', 'Amiri', serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box {
    text-align: center;
    padding: 60px 30px;
  }
  .box .icon { font-size: 4em; margin-bottom: 20px; }
  .box h1 {
    font-family: 'Amiri', serif;
    font-size: 2.2em;
    color: #f0c27f;
    margin-bottom: 12px;
  }
  .box p { color: #b8b8d4; font-size: 1.1em; line-height: 1.8; }
  .box a {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 30px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    color: #b8b8d4;
    text-decoration: none;
    font-family: 'Noto Naskh Arabic', serif;
    transition: all 0.3s;
  }
  .box a:hover {
    border-color: #f0c27f;
    color: #f0c27f;
  }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🚧</div>
  <h1>قريباً...</h1>
  <p>مشاريع جديدة قادمة إن شاء الله</p>
  <a href="../main.html">العودة للرئيسية</a>
</div>
</body>
</html>
